name: Validate Docker Compose & Secrets

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install yamllint
        run: sudo apt-get install -y yamllint

      - name: Lint all docker-compose.yml files
        run: |
          find ./services -name "docker-compose*.yml" -exec yamllint -c .yamllint.yml {} \;

      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Validate docker-compose files
        run: |
          for file in $(find ./services -name "docker-compose*.yml"); do
            echo "Validating $file"
            docker-compose -f $file config || exit 1
          done

      - name: Check for secrets (trufflehog)
        run: |
          docker run --rm -v $(pwd):/repo -w /repo trufflesecurity/trufflehog:latest filesystem /repo --only-verified
        continue-on-error: true
