services:
  tailscale-photoprism:
    image: tailscale/tailscale:latest
    container_name: tailscale-photoprism
    hostname: photos                          # <-- MagicDNS: photos.taila951c1.ts.net
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun
    environment:
      - TS_AUTH_KEY=YOUR_TAILSCALE_AUTH_KEY   # <-- a tua chave
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=photos
      - TS_ACCEPT_DNS=false
    volumes:
      - ./tailscale:/var/lib/tailscale

  photoprism:
    image: photoprism/photoprism:latest
    container_name: photoprism
    restart: unless-stopped
    network_mode: "service:tailscale-photoprism"
    mem_limit: 3072M                      # era 1536M; o VM tem folga (~7G livres)
    depends_on:
      - tailscale-photoprism
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      PHOTOPRISM_ADMIN_PASSWORD: "CHANGE_ME"
      PHOTOPRISM_SITE_URL: "https://photos.taila951c1.ts.net/"
      PHOTOPRISM_READONLY: "false"
      PHOTOPRISM_DISABLE_TLS: "true"
      PHOTOPRISM_DATABASE_DRIVER: "sqlite"
      PHOTOPRISM_STORAGE_PATH: "/photoprism/storage"
      PHOTOPRISM_WORKERS: "1"             # serializa o indexing = picos menores
    volumes:
      - "/Volumes/CrucialX9/Photos:/photoprism/originals"
      - "/Volumes/CrucialX9/photoprism/storage:/photoprism/storage"
